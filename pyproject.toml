[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genrec-shortvideo"
version = "0.1.0"
description = "Generative recommendation on KuaiRec: semantic IDs + lightweight seq2seq with constrained decoding (CPU-friendly)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
